%YAML:1.0
die-id: 0
target-infer-ids: [1, 3]
select-class-ids: [1, 2, 3]
interval: [3, 1]
output-order: 0
output-format: 3
output-shape: [1, 3, 512, 512]
data-type: 4
poolsize: 200
channel: 0

maintain_aspect_ratio:
  enable: true
  padding-value: [144, 144, 144]

normalize:
  enable: true
  normalizationmode: 1
  maxminreciprocal: [0.00392157, 0.00392157, 0.00392157]
  minvalue: [0.0, 0.0, 0.0]
  stdreciprocal: [1, 1, 1]
  meanvalue: [0, 0, 0]
  bypassstepquantization: false
  stepreciprocal: 127

crop:
  enable: false

dump:
  enable: false
