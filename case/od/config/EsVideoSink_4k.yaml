%YAML:1.0
################################################################################
#用哪个DIE上的DRM设备；
die-id: 0



#VO 接口类型:外设;
#0： CVBS；1：YPBPR；2：VGA; 3：BT656；4：BT1120；5：HDMI；6：LCD；7：BT656_H；
#8：BT565_L；9：LCD_6BIT；10：LCD_8BIT；11：LCD_16BIT；12：LCD_18BIT；13：LCD_24BIT；14：MIPI；15：MIPI_SLAVE
interface-type: 5



#VO接口时序,代表了视频层的显示区域的最大尺寸；
#[0： PAL]；[1：NTSC]；[2：1080P24]；[3：1080P25]；[4：1080P30];[5:1080P48];
#[6：720P25];[7：720P30];[8：720P50];[9：720P60]; [10：720P100];[11: 720P120]
#[12: 1080I50];[13: 1080I60];[14:1080P50];[15:1080P60];[16: 1080P100];[17: 1080P120;] 
#[18: 576P50];[19: 576P100]; [20: 576P200]; [21: 480P60]; [22: 480P120]; [23: 480P240]; 
#[24: 800x600_60]; [25: 1024x768_60]; [26: 1280x1024_60;]
#[27: 1366x768_60]; [28: 1440x900_60]; [29: 1440x480_60]; [30: 1440x576_50]; 
#[31: 1280x800_60]; [32: 1600x1200_60]; [33: 1680x1050_60];
#[34: 1920x1200_60]; [35: 640x480_60]; [36: 960H_PAL]; [37: 960H_NTSC]; [38: 1920x2160_30]; [39: 2560x1440_30]; [40: 2560x1440_60];
#[41: 2560x1600_60]; [42: 2880x240_60]; [43: 2880x288_50]; [44: 2880x480_60]; [45: 2880x576_50]; 
#[46: 3840x2160_24]; [47: 3840x2160_25]; [48: 3840x2160_30]; [49: 3840x2160_48]; [50: 3840x2160_50];
#[51:3840x2160_60]; [52:4096x2160_24]; [53: 4096x2160_25]; [54: 4096x2160_30]; [55: 4096x2160_48];
#[56: 4096x2160_50]; [57:4096x2160_60]; [58: 320x240_60]; [59:320x240_50]; [60:240x320_50];
#[61:240x320_60]; [62:800x600_50]; [63:720x1280_60]; [64:1080x1920_60]; [65:7680x4320_30];
interface-sync: 49


#视频层画布尺寸,画布用于显示图像,画布即所有通道的图像可以显示的区域；
image-size : [3840, 2160]


#视频层画布；显示坐标[x, y, width, height] , 其中偏移是[x, y]，尺寸是[width, height]
#视频层画布的[width,height]不能大于设备接口时序的最大分辨率；[x,y]是画布要显示的坐标偏移值；
#image-size和disp-rect的尺寸没有相关性，当image-size大于disp-rect的时候，会裁剪画布去适应分辨率，当image-size小于disp-rect的时候，会放大画布去适应分辨率;
disp-rect : [0, 0, 3840, 2160]


#通道显示尺寸；[channelID, x, y, width, height]
channel-params : [[0, 0, 0, 3840, 2160]]
