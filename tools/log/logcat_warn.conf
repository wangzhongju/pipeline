[global]
strict init = true
buffer min = 1024
buffer max = 0
rotate lock file = self
default format = "%d.%us %-6V (%c:%F:%L) - %m%n"

[levels]
TRACE = 10



[formats]
simple1	= "%D.%ms %V[%t] %f:%L   %m%n"
simple2	= "%d(%m%d%H%M%S).%us %V %t %m%n"
simple3	= "%d(%m%d%H%M%S).%us %V[%t] %f:%L   %m%n"



[rules]
sdk_sys.WARN      >stdout;simple1
sdk_vt.WARN       >stdout;simple1
sdk_venc.WARN     >stdout;simple1
sdk_vdec.WARN     >stdout;simple1
sdk_vps.WARN      >stdout;simple1
sdk_vo.WARN       >stdout;simple1
sdk_bms.WARN      >stdout;simple1
sdk_utils.WARN    >stdout;simple1


#sdk_sys.*	    所有等级
#sdk_sys.debug	代码内等级>=debug
#sdk_sys.=debug	代码内等级==debug
#sdk_sys.!debug	代码内等级!=debug

#sdk_vt.WARN      "a.log",5M ;simple1

