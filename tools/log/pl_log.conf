[global]
strict init = true
buffer min = 1024
buffer max = 0
rotate lock file = self
default format = "%d.%us %-6V (%c:%F:%L) - %m%n"

[levels]
TRACE = 10



[formats]
simple1	= "%D.%ms %V[%t] %f:%L   %m%n"
simple2	= "%d(%m%d%H%M%S).%us %V %t %m%n"
simple3	= "%d(%m%d%H%M%S).%us %V[%t] %f:%L   %m%n"



[rules]
#pl_vdec.TRACE     >stdout;simple1
#pl_venc.TRACE     >stdout;simple1
#pl_vps.TRACE      >stdout;simple1
#pl_vo.TRACE       >stdout;simple1
#pl_infer.TRACE	  >stdout;simple1
#pl_osd.TRACE	  >stdout;simple1
#pl_avdemux.TRACE  >stdout;simple1
#pl_preproc.TRACE  >stdout;simple1
#pl_postproc.TRACE  >stdout;simple1
#pl_grid.TRACE      >stdout;simple1
#pl_queue.TRACE      >stdout;simple1
#pl_tee.TRACE      >stdout;simple1
#pl_core.TRACE >stdout;simple1
#pl_v4l2.TRACE  >stdout;simple1
#pl_openvo.TRACE  >stdout;simple1
#pl_testsrc.TRACE  >stdout;simple1
#pl_testsink.TRACE  >stdout;simple1
#pl_others.TRACE  >stdout;simple1


#sdk_sys.*	    所有等级
#sdk_sys.debug	代码内等级>=debug
#sdk_sys.=debug	代码内等级==debug
#sdk_sys.!debug	代码内等级!=debug

#sdk_vt.WARN      "a.log",5M ;simple1

