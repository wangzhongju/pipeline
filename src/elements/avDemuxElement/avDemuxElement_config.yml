################################################################################
# 输入源（二选一）：本地文件或网络 URL。若同时配置，以代码优先级为准（先 file 再 url）。
# 本地文件示例
# file: "D:/media/sample_1080p.h264"
# 网络流示例
# url: "rtsp://user:pass@192.168.1.10/stream1"
file: ""
# url: ""

# 目标输出帧率（可选）。设置则做帧率整形；不设置按源保持。
outfps: 25

# 读取总帧数上限（可选）。>0 时在达到该帧数后主动停止，0 或缺省表示不限制。
totalframe: 0

# 调试转储（可选）
dump:
  # 是否启用 Dump（布尔/0或1）
  enable: 0
