# videosinkElement 配置文件（与源码键一致）
# 源码参数键：die-id, interface-auto, dumpflag, interface-sync, interface-type, image-size, disp-rect, channel-params, out-fps

---
################################################################################
# 用哪个DIE上的DRM设备；
die-id: 0

# 是否自动选择 interface-sync（根据显示设备能力选择最大分辨率与FPS）
interface-auto: true

# 调试 dump 标志（0/1），如需输出内部调试信息
# 具体行为参考实现
dumpflag: 0

# VO 接口类型（外设类型，对应底层枚举）
# 0：CVBS；1：YPBPR；2：VGA；3：BT656；4：BT1120；5：HDMI；6：LCD；7：BT656_H；
# 8：BT565_L；9：LCD_6BIT；10：LCD_8BIT；11：LCD_16BIT；12：LCD_18BIT；13：LCD_24BIT；14：MIPI；15：MIPI_SLAVE；16：VIRTUAL
interface-type: 5

# VO 接口时序（分辨率/帧率模式），对应 es_comm_vo.h 中 VO_INTF_SYNC_E 枚举
# 示例：53=3840x2160_60，具体枚举请参考注释/头文件
#VO接口时序,代表了视频层的显示区域的最大尺寸；  
#[0： PAL]；[1：NTSC]；[2：1080P24]；[3：1080P25]；[4：1080P30];[5:1080P48];
#[6：720P25];[7：720P30];[8：720P50];[9：720P60]; [10：720P100];[11: 720P120]
#[12: 1080I50];[13: 1080I60];[14:1080P50];[15:1080P60];[16: 1080P100];[17: 1080P120]
#[18: 576P50];[19: 576P100]; [20: 576P200]; [21: 480P60]; [22: 480P120]; [23: 480P240];
#[24: 800x600_60]; [25: 1024x768_60]; [26: 1152x864_75]; [27: 1280x1024_60]; [28: 1366x768_60];
#[29: 1440x900_60]; [30: 1440x480_60]; [31: 1440x576_50]; [32: 1280x800_60]; [33: 1600x1200_60];
#[34: 1600x900_60]; [35: 1680x1050_60]; [36: 1920x1200_60]; [37: 640x480_60]; [38: 960H_PAL];
#[39: 960H_NTSC]; [40: 1920x2160_30]; [41: 2560x1440_30]; [42: 2560x1440_60]; [43: 2560x1600_60];
#[44: 2880x240_60]; [45: 2880x288_50]; [46: 2880x480_60]; [47: 2880x576_50]; [48: 3840x2160_24];
#[49: 3840x2160_25]; [50: 3840x2160_30]; [51: 3840x2160_48]; [52: 3840x2160_50]; [53: 3840x2160_60];
#[54: 4096x2160_24]; [55: 4096x2160_25]; [56: 4096x2160_30]; [57: 4096x2160_48]; [58: 4096x2160_50];
#[59: 4096x2160_60]; [60: 320x240_60]; [61: 320x240_50]; [62: 240x320_50]; [63: 240x320_60];
#[64: 800x600_50]; [65: 720x1280_60]; [66: 1080x1920_60]; [67: 7680x4320_30];
interface-sync: 53

# 视频层画布尺寸（所有通道可显示的画布大小，需要与 videoGrid 合成输出保持一致）
image-size: [3840, 2160]

# 视频层画布显示区域 [x, y, width, height]
# - 画布的 [width,height] 不可大于接口时序的最大分辨率
# - 当 image-size 大于 disp-rect 会裁剪；小于则会放大以适配
disp-rect: [0, 0, 3840, 2160]

# 通道显示参数：列表内为 [channelID, x, y, width, height]
channel-params: [[0, 0, 0, 3840, 2160]]

# 输出帧率（可选）。当需要对显示刷新进行限速时使用；不配置使用默认
# out-fps: 60
